services:
  postgres:
    image: postgres:16
    container_name: ums-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/users_db.sql:/docker-entrypoint-initdb.d/users_db.sql
